apiVersion: v1
kind: Service
metadata:
  name: ch-server
  namespace: sandbox
spec:
  selector:
    app: ch-server
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
    - name: prometheus
      port: 9363
      targetPort: 9363
